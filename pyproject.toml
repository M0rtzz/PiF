[project]
name = "pif"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "datasets>=5.0.0",
    "flash-attn",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.2",
    "numpy==2.2.6",
    "openai==2.38.0",
    "protobuf==7.35.0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "tokenizers==0.22.2",
    "torch==2.7.1",
    "tqdm==4.67.3",
    "transformers==4.57.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
flash-attn = { url = "https://fastgit.cc/https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "aliyun-mirrors"
url = "https://mirrors.aliyun.com/pypi/web/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu126"
format = "flat"
explicit = true

[tool.black]
target-version = ["py310"]
skip-string-normalization = false
exclude = '''
.git/
|.venv/
'''
